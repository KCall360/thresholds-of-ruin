format = 2
id = "interactions"
version = "1.0"
ruleset = "interactions-v26"
default_character = 1
characters = [{ id = 1, anchor = "1/start", combat = {}, anatomy = { slots = ["weapon", "body_armor", "ring", "ring"] } }]

[archetypes.sword]
class = "weapon"
name = "sword"
equipment = { slot = "weapon", attack = { bonus = 4, wind_up = 60, recovery = 40, damage = { keen = 6 } } }

[archetypes.mail]
class = "armor"
name = "mail"
equipment = { slot = "body_armor", defense = 3, reductions = { impact = 2 } }

[archetypes.band]
class = "ring"
name = "ring of protection"
identity = "protection"
appearance_pool = "rings"
equipment = { slot = "ring", defense = 1 }

[archetypes.healing]
class = "potion"
name = "potion of healing"
identity = "healing"
appearance_pool = "potions"
stackable = true
consumable = { effects = [{ type = "heal", amount = 5 }] }

[archetypes.poison]
class = "potion"
name = "potion of poison"
identity = "poison"
appearance_pool = "potions"
stackable = true
consumable = { effects = [{ type = "damage", components = { vital = 8 } }] }

[appearance_pools.potions]
appearances = ["red potion"]
confounding = true

[appearance_pools.rings]
appearances = ["silver ring"]
