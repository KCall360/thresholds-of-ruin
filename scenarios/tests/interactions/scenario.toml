format = 36
id = "interactions"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
characters = [{ id = 1, anchor = "1/start", creature = { species = "figure", name = "figure", faction = "neutral", binding = "intellect", hit_dice = [{ source = "racial", purchases = [] }], starting_skills = ["deception", "persuasion"], restoration = "choose_again", nutrition = { kind = "exempt" } } }]

[archetypes.sword]
class = "weapon"
name = "sword"
equipment = { slot = "weapon", attack = { skill = "heavy_weaponry", bonus = 4, wind_up = 60, recovery = 40, damage = { primary = { category = "keen" }, components = [{ category = "keen", amount = { type = "fixed", value = 6 } }] } }, modifiers = [] }

[archetypes.mail]
class = "armor"
name = "mail"
equipment = { slot = "body_armor", armor = { physical_reduction = 3, material = "metal", rustproof = false }, modifiers = [{ scope = "always", op = { kind = "reduction", selector = { kind = "category", category = "impact" }, amount = 2 } }] }

[archetypes.band]
class = "ring"
name = "ring of protection"
identity = "protection"
appearance_pool = "rings"
equipment = { slot = "ring", modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "defense", defense = "physical" }, value = 1 } }] }

[archetypes.healing]
class = "potion"
name = "potion of healing"
identity = "healing"
appearance_pool = "potions"
stackable = true
consumable = { effects = [{ kind = "heal", amount = { kind = "fixed", amount = 5 } }] }

[archetypes.poison]
class = "potion"
name = "potion of poison"
identity = "poison"
appearance_pool = "potions"
stackable = true
consumable = { effects = [{ kind = "damage", damage = { kind = "components", components = [{ category = "vital", amount = { kind = "fixed", amount = 8 } }] } }] }

[appearance_pools.potions]
appearances = ["red potion"]
confounding = true

[appearance_pools.rings]
appearances = ["silver ring"]

# Synthetic one-HD fixture subjects leave advancement points unspent.
# Fixed attacks and source modifiers control health, hit probability and timing.

[creatures.species.figure]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
anatomy = { slots = ["weapon", "body_armor", "ring", "ring", "weapon"], capacities = { grip = 2 }, primary_attack_socket = { kind = "socket", slot = 0 } }
melee = { skill = "heavy_weaponry", bonus = 2, wind_up = 60, recovery = 40, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "fixed", amount = 4 } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 22 } }]
