format = 23
id = "ai-interactions"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
factions = { delvers = ["ruin"], ruin = ["delvers"] }
ai_profiles = { tactical = { care = true, equipment = true, loot = true, flee_percent = 25 } }
characters = [{ id = 1, anchor = "1/start", turn_ticks = 100, creature = { species = "delver", name = "delver", faction = "delvers", binding = "intellect", hit_dice = [{ source = "racial", purchases = [] }], starting_skills = ["deception", "persuasion"], restoration = "choose_again", nutrition = { kind = "exempt" } } }]

[archetypes.healing]
class = "potion"
name = "potion of healing"
identity = "healing"
appearance_pool = "potions"
stackable = true
consumable = { effects = [{ kind = "heal", amount = { kind = "fixed", amount = 10 } }] }

[archetypes.old_mail]
class = "armor"
name = "old mail"
equipment = { slot = "body_armor", armor = { physical_reduction = 1, material = "metal", rustproof = false }, modifiers = [] }

[archetypes.mail]
class = "armor"
name = "mail"
equipment = { slot = "body_armor", armor = { physical_reduction = 3, material = "metal", rustproof = false }, modifiers = [] }

[archetypes.old_ring]
class = "ring"
name = "old ring"
equipment = { slot = "ring", modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "defense", defense = "physical" }, value = 2 } }] }

[archetypes.ring]
class = "ring"
name = "ring"
equipment = { slot = "ring", modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "defense", defense = "physical" }, value = 3 } }] }

[archetypes.hidden_ring]
class = "ring"
name = "ring of protection"
identity = "protection"
appearance_pool = "rings"
equipment = { slot = "ring", modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "defense", defense = "physical" }, value = 5 } }] }

[appearance_pools.rings]
appearances = ["silver ring"]
confounding = true

[appearance_pools.potions]
appearances = ["red potion"]
confounding = true

# Synthetic one-HD fixture subjects leave advancement points unspent.
# Fixed attacks and source modifiers control health, hit probability and timing.

[creatures.species.ruin_guard]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
anatomy = { slots = ["body_armor", "ring", "ring", "head_armor"], capacities = {}, primary_attack_socket = { kind = "none" } }
melee = { skill = "heavy_weaponry", bonus = 0, wind_up = 80, recovery = 20, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "fixed", amount = 1 } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 22 } }]

[creatures.species.delver]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 1000, wind_up = 1, recovery = 99, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "vital", amount = { kind = "fixed", amount = 15 } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 92 } }]
