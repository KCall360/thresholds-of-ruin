# Five halls for region streaming tests: an actor a client controls waits
# far from the default character, so its own hall must stay in play, and a
# guard stands frozen in the hall beside it.
format = 2
id = "streaming-controlled"
version = "1.0"
ruleset = "interactions-v26"
default_character = 1
factions = { delvers = [], wardens = [] }
ai_profiles = { patrol = { memory_ticks = 200, flee_percent = 0 } }
characters = [{ id = 1, anchor = "1/start", turn_ticks = 100 }]

# Synthetic one-HD fixture subjects leave training and talent slots unspent.
# Fixed attacks and source grants control health, hit probability and timing.

[creatures.species.warden]
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 100, wind_up = 20, recovery = 80, damage = { primary = { category = "impact" }, components = [{ category = "impact", amount = { type = "fixed", value = 1 } }] } }
grants = [{ type = "health", amount = 2 }]
