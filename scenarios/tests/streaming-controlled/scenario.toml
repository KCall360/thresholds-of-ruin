# Five halls for region streaming tests: an actor a client controls waits
# far from the default character, so its own hall must stay in play, and a
# guard stands frozen in the hall beside it.
format = 16
id = "streaming-controlled"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
factions = { delvers = [], wardens = [] }
ai_profiles = { patrol = { care = true, equipment = true, loot = true, flee_percent = 0 } }
characters = [{ id = 1, anchor = "1/start", turn_ticks = 100 }]

# Synthetic one-HD fixture subjects leave advancement points unspent.
# Fixed attacks and source modifiers control health, hit probability and timing.

[creatures.species.warden]
behavior = { disposition = "mean", idle = "explore", memory_ticks = 1000 }
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 100, wind_up = 20, recovery = 80, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "fixed", amount = 1 } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 2 } }]
