# Seven halls in a row for region streaming tests: long enough that, at the
# default radii, halls behind the character detach and halls ahead are built
# only when needed. A guard waits in a far hall.
format = 5
id = "streaming-corridor"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
factions = { delvers = [], wardens = [] }
ai_profiles = { patrol = { memory_ticks = 200, flee_percent = 0 } }
characters = [{ id = 1, anchor = "1/start", turn_ticks = 100, creature = { species = "delver", name = "delver", faction = "delvers", binding = "intellect", hit_dice = [{ source = "racial", purchases = [] }], starting_skills = ["deception", "persuasion"], restoration = "choose_again" } }]

# Synthetic one-HD fixture subjects leave advancement points unspent.
# Fixed attacks and source modifiers control health, hit probability and timing.

[creatures.species.warden]
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 100, wind_up = 20, recovery = 80, damage = { primary = { category = "impact" }, components = [{ category = "impact", amount = { type = "fixed", value = 1 } }] } }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 2 } }]

[creatures.species.delver]
kind = "humanoid"
attributes = { strength = 0, speed = 0, intellect = 0, willpower = 0, awareness = 0, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 100, wind_up = 20, recovery = 80, damage = { primary = { category = "keen" }, components = [{ category = "keen", amount = { type = "fixed", value = 10 } }] } }
modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health" }, value = 12 } }]
