format = 2
id = "paired-stairs"
version = "1.0"
ruleset = "interactions-v25"
default_character = 1
characters = [{ id = 1, anchor = "1/stair", turn_ticks = 100 }]

[stair_pairs.first]
upper = "1/stair"
lower = "2/up"

[stair_pairs.second]
upper = "2/down"
lower = "3/stair"

[stair_pairs.folded]
upper = "3/stair"
lower = "3/return"
