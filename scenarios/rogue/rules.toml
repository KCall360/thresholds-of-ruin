path = ["expertises", "rogue.knife"]
value = { id = "rogue.knife", name = "Knife", category = "equipment" }

[[overrides]]
op = "add"
path = ["expertises", "rogue.shortbow"]
value = { id = "rogue.shortbow", name = "Shortbow", category = "equipment" }

[[overrides]]
