path = ["growth", "threat", "overrides"]
value = [{ source = { kind = "expertise", id = "rogue.knife" }, points = 10 }, { source = { kind = "expertise", id = "rogue.shortbow" }, points = 10 }, { source = { kind = "expertise", id = "rogue.spear" }, points = 10 }]

