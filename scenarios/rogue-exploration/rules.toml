value = { id = "rogue.freezing_touch", name = "Freezing Touch", interaction = "hostile_to_target", tags = ["attack"], basic_attack = false, invocation = "actor_target", timing = { source = { kind = "fixed", prepare = 100, recover = 100 }, scaled_by = "speed" }, reach = { kind = "melee" }, strikes = { kind = "natural_melee", additional_riders = [{ trigger = "success", check = { skill = { kind = "natural_attack" }, defense = "physical" }, effects = [{ kind = "apply_condition", condition = "rogue.frozen", duration = 200 }], descriptors = ["cold"] }] }, ai = { priority = 20, hostile = true, minimum_resource_percent = 0, range_preference = "any" } }

[[overrides]]
