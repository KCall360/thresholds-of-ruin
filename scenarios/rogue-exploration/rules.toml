path = ["talents", "rogue.freezing_touch"]
value = { id = "rogue.freezing_touch", name = "Freezing Touch", prerequisites = [], requirement = { kind = "all", requirements = [{ kind = "total_hd", minimum = 1 }, { kind = "subtype_in", subtypes = ["cold"] }] }, form_choices = [], modifiers = [{ scope = "always", op = { kind = "grant_ability", ability = "rogue.freezing_touch" } }] }

# DR1: accepted TOR Spiritual-checked restorable maximum-Health drain.
# Species natural damage is imported once; this action adds no Feed or damage.
# Timing and AI priority follow CH1's provisional signature pattern.
[[overrides]]
