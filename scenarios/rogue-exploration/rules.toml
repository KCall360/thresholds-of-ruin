# RG1 halves ordinary recovery via its owned purchase, not the eligibility flag.
# Original Rogue regeneration update-cycle parity remains unverified.
[[overrides]]
op = "add"
path = ["talents", "rogue.regeneration"]
value = { id = "rogue.regeneration", name = "Regeneration", prerequisites = [], requirement = { kind = "all", requirements = [{ kind = "total_hd", minimum = 1 }, { kind = "flag", flag = "regenerative", present = true }] }, form_choices = [], modifiers = [{ scope = "always", op = { kind = "add", stat = { kind = "health_recovery_period_percent" }, value = -50 } }] }

[[overrides]]
