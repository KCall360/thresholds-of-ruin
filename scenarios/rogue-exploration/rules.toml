path = ["nutrition_condition_trigger"]
value = { kind = "on_empty_depletion", condition = "rogue.faint", chance = { one_in = 5 }, duration = { kind = "rolled", dice = { count = 1, sides = 8, bonus = 3 } }, ticks_per_unit = 100 }

[[overrides]]
op = "add"
path = ["conditions", "rogue.faint"]
value = { id = "rogue.faint", family = "rogue.faint", lifecycle = "timed", name = "Fainted", modifiers = [], stacking = { kind = "keep" }, source_scoped = false, descriptors = [], capacity = "reject", timing = { kind = "actor_active", on_expiry = { kind = "remove" } }, restrictions = ["voluntary_actions"], preparation = "pause" }

# CH1 uses the accepted 200/400 actor-active policy. Its 100/100 action timing
# and AI priority are provisional TOR tuning. No production floor pool selects it.
# Reconstructed reconciliation: inherit the actual species contact; add only CH1
# riders here, so a future species sequence still uses its one source of truth.
[[overrides]]
op = "add"
path = ["conditions", "rogue.frozen"]
value = { id = "rogue.frozen", family = "rogue.frozen", lifecycle = "timed", name = "Frozen", modifiers = [], stacking = { kind = "keep" }, source_scoped = false, descriptors = ["cold"], capacity = "reject", timing = { kind = "actor_active", on_expiry = { kind = "protect", duration = 400 } }, restrictions = ["voluntary_actions"], preparation = "pause" }

[[overrides]]
