import = "interactions-v46"

# Equipment expertise is an ordinary HD-point or earned Intellect choice.
# No preset, species, NPC or default talent receives a free expertise grant.
[[overrides]]
op = "add"
path = ["expertises", "rogue.knife"]
value = { id = "rogue.knife", name = "Knife", category = "equipment" }

[[overrides]]
op = "add"
path = ["expertises", "rogue.shortbow"]
value = { id = "rogue.shortbow", name = "Shortbow", category = "equipment" }

[[overrides]]
op = "add"
path = ["ability_tags", "ranged"]
value = { id = "ranged", name = "Ranged attack" }

# Combat-benefit prices are provisional TOR tuning. The shared expertise
# baseline remains zero; no pure-grant talent is added or counted a second time.
[[overrides]]
op = "set"
path = ["growth", "threat", "overrides"]
value = [{ source = { kind = "expertise", id = "rogue.knife" }, points = 10 }, { source = { kind = "expertise", id = "rogue.shortbow" }, points = 10 }]

