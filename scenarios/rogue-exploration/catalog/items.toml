# Starter equipment and finite supplies; numerical values are provisional.
namespace = "rogue"

[items."rogue.mace"]
asset = "item.weapon.mace"
name = "mace"
identity = "rogue.mace"
class = "weapon"
# The original +1/+1 starter stats are explicit owned birth state.
equipment_generation = { kind = "authored", hit_enchantment = 1, damage_enchantment = 1 }
equipment = { slot = "weapon", attack = { skill = "heavy_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "impact", sides = 4 }, components = [{ category = "impact", amount = { type = "rolled", count = 2, sides = 4, bonus = 0 } }] } }, modifiers = [] }

[items."rogue.ring_mail"]
asset = "item.armor.mail"
name = "ring mail"
identity = "rogue.ring_mail"
class = "armor"
equipment_generation = { kind = "authored" }
equipment = { slot = "body_armor", armor = { physical_reduction = 2, material = "metal", rustproof = false }, modifiers = [] }

[items."rogue.clean_bandage"]
asset = "item.bandage"
name = "clean bandage"
identity = "rogue.clean_bandage"
class = "misc"
stackable = true
supply = "bandage"

[items."rogue.ration"]
asset = "item.food.ration"
name = "food ration"
identity = "rogue.ration"
class = "food"
stackable = true
supply = "ration"
edible = { nutrition = { kind = "rolled", dice = { count = 1, sides = 400, bonus = 1099 } } }

# Bound by the retrieval objective; never ordinary population or starter stock.
[items."rogue.amulet_of_yendor"]
asset = "item.amulet"
name = "Amulet of Yendor"
identity = "rogue.amulet_of_yendor"
magical = true
class = "amulet"
stackable = false

# Ordinary restoration removes only the recorded Strength deficit. The fixed
# 1000 operand covers limits::DERIVED_ATTRIBUTE, the canonical deficit bound;
# actual restoration clamps to that deficit. This adds no heal or bonus Strength.
[items."rogue.restore_strength"]
asset = "item.potion"
name = "potion of restore strength"
identity = "rogue.restore_strength"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "self_effect", effects = [{ kind = "restore_attribute", attribute = "strength", amount = { kind = "fixed", amount = 1000 } }] }

[appearance_pools."rogue.potions"]
asset = "item.potion"
appearances = ["amber potion", "smoky potion", "violet potion", "azure potion"]

# Ordinary recoverable stacks; neither a purse abstraction nor a supply item.
[items."rogue.gold"]
asset = "item.coin"
name = "gold coin"
identity = "rogue.gold"
class = "coin"
stackable = true
currency = "gold"
magical = false

# Ordinary healing keeps the source's independent level-d4 rolls, sight cure,
# on-use recognition and strict overflow trigger. TOR uses active owned HD and
# improves the earliest eligible acquisition roll by one, bounded by its original
# die maximum. An improved drained row keeps its bonus only on same-row restoration.
[items."rogue.healing"]
asset = "item.potion"
name = "potion of healing"
identity = "rogue.healing"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "heal_per_hit_die", sides = 4, bonus = 0, overflow = "improve_earliest_hit_die" }, { kind = "remove_condition", condition = "rogue.blindness" }] }

# Ordinary timed potion conditions have no gaze-expiry protection. Durations
# preserve source ranges in actor turns; TOR actor-active ticks are an adaptation.
[items."rogue.confusion"]
asset = "item.potion"
name = "potion of confusion"
identity = "rogue.confusion"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.potion_confusion", duration = { kind = "rolled", dice = { count = 1, sides = 2, bonus = 18 } } }] }

[items."rogue.blindness"]
asset = "item.potion"
name = "potion of blindness"
identity = "rogue.blindness"
magical = true
class = "potion"
stackable = true
appearance_pool = "rogue.potions"
consumable = { discovery = "on_use", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.blindness", duration = { kind = "rolled", dice = { count = 1, sides = 85, bonus = 807 } } }] }

# Initial identify supports one physical category per scroll. The identified
# type and selected exact instance are separate knowledge facts.
[items."rogue.identify_potion"]
asset = "item.scroll"
name = "scroll of identify potion"
identity = "rogue.identify_potion"
magical = true
class = "scroll"
stackable = true
appearance_pool = "rogue.scrolls"
readable = { identify = "potion", discovery = "on_use" }

[items."rogue.sleep"]
asset = "item.scroll"
name = "scroll of sleep"
identity = "rogue.sleep"
magical = true
class = "scroll"
stackable = true
appearance_pool = "rogue.scrolls"
readable = { discovery = "on_use", effects = [{ kind = "apply_condition_for_turns", condition = "rogue.sleep", duration = { kind = "rolled", dice = { count = 1, sides = 5, bonus = 3 } } }] }

[appearance_pools."rogue.scrolls"]
asset = "item.scroll"
appearances = ["scroll titled VEL MOR", "scroll titled ELAM TOR", "scroll titled NAR SHEN", "scroll titled HETH ARA", "scroll titled TAL ION", "scroll titled UR SEK", "scroll titled KEL RAN", "scroll titled AN DOR", "scroll titled IV MEM", "scroll titled OS THAL"]

[items."rogue.identify_scroll"]
