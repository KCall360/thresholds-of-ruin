equipment = { slot = "weapon", attack = { skill = "heavy_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "keen", sides = 4 }, components = [{ category = "keen", amount = { type = "rolled", count = 3, sides = 4, bonus = 0 } }] } }, modifiers = [] }

[items."rogue.dagger"]
asset = "item.weapon"
