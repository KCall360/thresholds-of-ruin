identity = "rogue.dagger"
class = "weapon"
equipment_generation = { kind = "weapon", curse_percent = 10, enchant_percent = 5, minimum = 1, maximum = 3 }
equipment = { slot = "weapon", attack = { skill = "light_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "keen", sides = 6 }, components = [{ category = "keen", amount = { type = "rolled", count = 1, sides = 6, bonus = 0 } }] } }, weapon_profile = { expertise = "rogue.knife", base_traits = [], expert_traits = { add = [{ kind = "thrown", range = { short_feet = 20, long_feet = 60 } }, { kind = "offhand" }], remove = [] } }, modifiers = [] }

# Knife and shortbow traits/ranges use the selected Plotweaver Open Alpha v0.3
# and Stormlight Starter Rules mapping. Discreet has no supported consumer and
# is deliberately absent. Existing 60/40 timing is provisional TOR tuning.
[items."rogue.shortbow"]
asset = "item.weapon"
name = "shortbow"
identity = "rogue.shortbow"
class = "weapon"
equipment_generation = { kind = "weapon", curse_percent = 10, enchant_percent = 5, minimum = 1, maximum = 3 }
equipment = { slot = "weapon", attack = { skill = "light_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "impact" }, components = [{ category = "impact", amount = { type = "fixed", value = 1 } }] } }, weapon_profile = { expertise = "rogue.shortbow", launcher = { family = "rogue.bow", range = { short_feet = 80, long_feet = 320 } }, base_traits = [{ kind = "two_handed" }], expert_traits = { add = [{ kind = "quickdraw" }], remove = [] } }, modifiers = [] }

# Arrow payload keeps the pinned Rogue launched 2d3 damage. It replaces the
# bow's incidental melee base damage; both still use the ordinary TOR checks.
# https://github.com/phs/rogue/blob/c7c119f893bd2f8255f2ad78d58a32664ddb9a97/weapons.c
# Successful hits consume one arrow; misses use the shared recoverable landing.
[items."rogue.arrow"]
asset = "item.weapon"
name = "arrow"
identity = "rogue.arrow"
class = "weapon"
stackable = true
projectile = { family = "rogue.bow", damage = { primary = { category = "keen", sides = 3 }, components = [{ category = "keen", amount = { type = "rolled", count = 2, sides = 3, bonus = 0 } }] }, recovery = "consumed_on_hit" }

