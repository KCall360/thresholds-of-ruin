# Finite gear. Rogue source weapon dice and existing birth distributions are
# preserved; skill/category, uniform 60/40 timing and armor physical DR are
# conservative provisional TOR adaptations, not a direct AC conversion.
# https://github.com/phs/rogue/blob/c7c119f893bd2f8255f2ad78d58a32664ddb9a97/things.c#L250-L269
# Generated and starter archetypes share neutral immutable equipment definitions.

[items."rogue.generated_mace"]
asset = "item.weapon.mace"
name = "mace"
identity = "rogue.mace"
class = "weapon"
equipment_generation = { kind = "weapon", curse_percent = 10, enchant_percent = 5, minimum = 1, maximum = 3 }
equipment = { slot = "weapon", attack = { skill = "heavy_weaponry", bonus = 0, wind_up = 60, recovery = 40, damage = { primary = { category = "impact", sides = 4 }, components = [{ category = "impact", amount = { type = "rolled", count = 2, sides = 4, bonus = 0 } }] } }, modifiers = [] }

