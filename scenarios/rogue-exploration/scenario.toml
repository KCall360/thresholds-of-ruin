format = 30
id = "rogue-exploration"
version = "1.0"
ruleset = "rules.toml"
modules = ["catalog/creatures.toml", "catalog/actors.toml", "catalog/items.toml"]
# Both presets keep their first advancement point for an ordinary player choice.
default_character = 1
themes = ["dungeon"]
factions = { delvers = ["dungeon_foes"], dungeon_foes = ["delvers"] }
ai_profiles = { rogue_hostile = { flee_percent = 0 } }

[[characters]]
asset = "creature.humanoid.human"
id = 1
anchor = "dungeon/1/start"
turn_ticks = 100
unselected = "omit"
body = { cells = [[0,0,0], [0,0,1]], eye = [0,0,1], mass = 80 }
known_identities = ["rogue.mace", "rogue.ring_mail", "rogue.clean_bandage", "rogue.ration", "rogue.amulet_of_yendor"]
loadout = [
  { archetype = "rogue.mace", quantity = 1, equipped_slot = 0 },
  { archetype = "rogue.ring_mail", quantity = 1, equipped_slot = 2 },
  { archetype = "rogue.clean_bandage", quantity = 3 },
  { archetype = "rogue.ration", quantity = 1 },
]
[characters.creature]
species = "rogue.human"
name = "Warrior"
faction = "delvers"
binding = "intellect"
starting_skills = ["heavy_weaponry", "discipline"]
restoration = "choose_again"
nutrition = { kind = "required" }
future_growth = { kind = "selected", source = { kind = "class", class = "warrior" } }
hit_dice = [{ source = "warrior", purchases = [] }]

[[characters]]
asset = "creature.humanoid.human"
id = 2
anchor = "dungeon/1/start"
turn_ticks = 100
unselected = "omit"
body = { cells = [[0,0,0], [0,0,1]], eye = [0,0,1], mass = 80 }
known_identities = ["rogue.mace", "rogue.ring_mail", "rogue.clean_bandage", "rogue.ration", "rogue.amulet_of_yendor"]
loadout = [
  { archetype = "rogue.mace", quantity = 1, equipped_slot = 0 },
  { archetype = "rogue.ring_mail", quantity = 1, equipped_slot = 2 },
  { archetype = "rogue.clean_bandage", quantity = 3 },
  { archetype = "rogue.ration", quantity = 1 },
]
[characters.creature]
species = "rogue.human"
name = "Mage"
faction = "delvers"
binding = "intellect"
starting_skills = ["spellcasting", "heavy_weaponry"]
restoration = "choose_again"
nutrition = { kind = "required" }
future_growth = { kind = "selected", source = { kind = "class", class = "mage" } }
hit_dice = [{ source = "mage", purchases = [] }]

[generation_recipes.exploration]
kind = "grid_rooms"
version = 1
room_width = [4, 24]
room_height = [3, 5]
extra_connections = [0, 2]
lighting = { darkness_roll = 10, darkness_start = 1 }
# Provisional TOR discovery balance, not approved historical numerical parity.
secret_entrances = { chance_per_mille = 250, maximum = 2, dc = 12 }
hidden_traps = { count = [1, 2], dc = 12, rust_slot = "body_armor", rust_amount = 1, sleep_condition = "rogue.sleep", sleep_duration = 200, sleep_exposure = "poison", hazards = { avoidance_dc = 12, bear_condition = "rogue.bear_trap", bear_duration = 300, arrow_ammunition = "rogue.arrow", attack_bonus = 0, poison_exposure = "poison" } }

[procedural_worlds.dungeon]
gravity = [0, 0, -1]
kind = "grid_chain"
version = 1
base_region = 1
grid = [3, 3]
size = [26, 7, 2]
recipe = "exploration"

[procedural_worlds.dungeon.domain]
kind = "open"
max_depth = 1000000

[capabilities]
npc_stair_traversal = false

# Relocate the one ordinary identity on every eligible actual player entry.
[unique_retrieval]
version = 1
protagonist = "selected_character"
family = "dungeon"
minimum_depth = 26
archetype = "rogue.amulet_of_yendor"
exit_anchor = "dungeon/1/up"

[floor_activation]
version = 1
protagonist = "selected_character"
families = { dungeon = "rogue.low_depth" }

# Source-shaped cadence; active-tick tuning and eight-live cap are TOR adaptations.
# A winning trial rearms the long delay even if capacity or placement blocks it.
[floor_activation.wandering]
stage_id = "rogue.eight_species_foes"
excluded_wandering_content = ["rogue.dragon", "rogue.ice_monster", "rogue.leprechaun", "rogue.nymph", "rogue.venus_flytrap", "rogue.xeroc"]
initial_delay = [6700, 7300]
retry_ticks = 400
chance = { numerator = 1, denominator = 6 }
living_cap = 8


# All twenty-six species; historical stage/pool IDs preserve deterministic stream ownership.
# Equal ration/bandage stock is provisional TOR tuning, not original loot equivalence.
[floor_activation.carried_item_pools."rogue.vampire_supplies"]
version = 1
choices = [{ archetype = "rogue.ration", weight = 1, quantity = 1 }, { archetype = "rogue.clean_bandage", weight = 1, quantity = 1 }]

# Finite ordinary gold is sampled once from this birth floor, not on death.
[floor_activation.carried_item_pools."rogue.leprechaun_gold"]
version = 1
choices = [{ archetype = "rogue.gold", weight = 1, quantity = { kind = "depth_scaled_uniform", minimum = 2, maximum_base = 51, per_depth = 10 } }]

[floor_activation.profiles."rogue.low_depth"]
version = 1

[[floor_activation.profiles."rogue.low_depth".stages]]
id = "rogue.eight_species_foes"
version = 1
kind = "actors"
count = [4, 4]
