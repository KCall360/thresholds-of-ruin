modules = ["catalog/actors.toml", "catalog/items.toml"]
format = 10
id = "first-dungeon"
version = "1.0"
ruleset = "rules.toml"
default_character = 1
themes = ["ruined-stone", "scavengers"]
factions = { delvers = ["ruin"], ruin = ["delvers"], neutral = [] }
ai_profiles = { tactical = { memory_ticks = 1000, flee_percent = 25 } }
objective = { anchor = "1/exit", item = 100, disclosed = true, continue_play = false }

[[characters]]
id = 1
anchor = "1/exit"
turn_ticks = 100
body = { cells = [[0,0,0], [0,0,1]], eye = [0,0,1], mass = 80 }
creature = { species = "human", name = "delver", faction = "delvers", binding = "intellect", hit_dice = [{ source = "warrior", purchases = [{ pool = "advancement", selection = { kind = "talent", talent = "power_strike" } }] }, { source = "warrior", purchases = [{ pool = "advancement", selection = { kind = "talent", talent = "guard" } }] }, { source = "warrior", purchases = [{ pool = "advancement", selection = { kind = "talent", talent = "heavy_blows" } }] }, { source = "warrior", attribute = "strength", purchases = [{ pool = "advancement", selection = { kind = "talent", talent = "mighty_blows" } }] }], starting_skills = ["heavy_weaponry", "athletics"], restoration = "choose_again" }

[creatures.species.human]
kind = "humanoid"
attributes = { strength = 2, speed = 2, intellect = 2, willpower = 2, awareness = 2, presence = 2 }
melee = { skill = "heavy_weaponry", bonus = 0, wind_up = 60, recovery = 40, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "rolled", dice = { count = 1, sides = 4, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }

[creatures.species.ruin_scavenger]
kind = "humanoid"
subtypes = ["goblinoid"]
attributes = { strength = 1, speed = 2, intellect = 1, willpower = 1, awareness = 2, presence = 1 }
melee = { skill = "light_weaponry", bonus = 0, wind_up = 80, recovery = 50, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "keen", amount = { kind = "rolled", dice = { count = 1, sides = 4, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }

[creatures.species.stone_construct]
kind = "construct"
attributes = { strength = 3, speed = 0, intellect = 0, willpower = 0, awareness = 1, presence = 0 }
melee = { skill = "heavy_weaponry", bonus = 0, wind_up = 130, recovery = 70, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "impact", amount = { kind = "rolled", dice = { count = 1, sides = 8, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "reduction", selector = { category = "impact", kind = "category" }, amount = 2 } }]

[creatures.species.fire_wisp]
kind = "elemental"
subtypes = ["fire"]
attributes = { strength = 0, speed = 3, intellect = 1, willpower = 1, awareness = 2, presence = 1 }
anatomy = { slots = [] }
melee = { skill = "light_weaponry", bonus = 0, wind_up = 70, recovery = 80, strikes = [{ offset = 0, check = { actor = "user", skill = { kind = "selected_weapon" }, against = { kind = "defense", defense = "physical" } }, on_success = [{ kind = "damage", damage = { kind = "components", components = [{ category = "energy", descriptor = "fire", amount = { kind = "rolled", dice = { count = 1, sides = 6, bonus = 0 } } }] } }], on_failure = [], descriptors = [], riders = [] }] }
modifiers = [{ scope = "always", op = { kind = "flag", flag = "magical" } }]
