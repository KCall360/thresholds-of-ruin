[package]
name = "tor-server"
default-run = "tor-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Explicitly selected development adapter; never part of the server CLI.
service-contract-host = []

[[bin]]
name = "tor-service-contract-host"
path = "src/bin/tor-service-contract-host.rs"
required-features = ["service-contract-host"]
test = false
bench = false

[lints]
workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha1 = "0.11"
tor-simulation.workspace = true
tor-protocol.workspace = true
tor-world.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
uuid.workspace = true
rusqlite = { version = "0.41.0", features = ["bundled"] }
toml = "1.1.6"
sha2 = "0.11.0"
hmac = "0.13.0"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tor-test-support = { path = "../test-support" }
tor-client-common.workspace = true
tor-client-ascii = { path = "../client-ascii" }
