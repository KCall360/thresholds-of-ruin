format = 15
id = "menagerie"
version = "1.0"
ruleset = "rules.toml"
modules = ["catalog/creatures.toml", "catalog/actors.toml", "catalog/items.toml"]
# A viewing hall for the 3D client: every rogue creature wanders one lit
# chamber at peace, except an emu and a snake that pick a fight, and items
# lie on the floor nearby.
default_character = 1
factions = { delvers = ["sparring"], sparring = ["delvers"], dungeon_foes = [] }
ai_profiles = { wander = { care = false, equipment = false, loot = false, flee_percent = 0 } }

[[characters]]
id = 1
anchor = "1/start"
turn_ticks = 100
unselected = "omit"
body = { cells = [[0,0,0], [0,0,1]], eye = [0,0,1], mass = 80 }
known_identities = ["rogue.mace", "rogue.ring_mail", "rogue.clean_bandage", "rogue.ration"]
loadout = [
  { archetype = "rogue.mace", quantity = 1, equipped_slot = 0 },
  { archetype = "rogue.ring_mail", quantity = 1, equipped_slot = 2 },
]
[characters.creature]
species = "rogue.human"
name = "Warrior"
faction = "delvers"
binding = "intellect"
starting_skills = ["heavy_weaponry", "discipline"]
restoration = "choose_again"
nutrition = { kind = "required" }
future_growth = { kind = "selected", source = { kind = "class", class = "warrior" } }
hit_dice = [{ source = "warrior", purchases = [] }]
