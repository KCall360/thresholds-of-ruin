[workspace]
resolver = "2"
members = [
    "crates/world",
    "crates/simulation",
    "crates/protocol",
    "crates/server",
    "crates/client-common",
    "crates/client-ascii",
    "crates/client-text",
    "crates/client-headless",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/KCall360/thresholds-of-ruin"

[workspace.dependencies]
tor-world = { path = "crates/world" }
tor-simulation = { path = "crates/simulation" }
tor-protocol = { path = "crates/protocol" }
tor-client-common = { path = "crates/client-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
