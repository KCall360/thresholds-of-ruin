name: Independent 3D client

on:
  pull_request:
    paths:
      - "crates/client-3d/**"
      - ".github/workflows/client-3d.yml"
  push:
    branches: [main]
    paths:
      - "crates/client-3d/**"
      - ".github/workflows/client-3d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-3d-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 3D (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        profile: [debug, release]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/client-3d -> target"
          shared-key: client-3d-${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux native rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxkbcommon-x11-0 libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers xvfb xdotool
      - name: Verify Windows native client
        if: runner.os == 'Windows'
        run: python crates/client-3d/scripts/verify.py --profile ${{ matrix.profile }}
      - name: Verify Linux native client
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 crates/client-3d/scripts/verify.py --profile ${{ matrix.profile }}
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-3d-${{ matrix.os }}-${{ matrix.profile }}
          path: .local/verify-3d/
          if-no-files-found: warn
