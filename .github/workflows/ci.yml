        with:
          shared-key: selected-v2-${{ runner.os }}-release-python-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install native build and test dependencies
        if: runner.os == 'Linux'
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev xvfb xauth xdotool
      - name: Require native Windows desktop
        if: runner.os == 'Windows'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install pinned test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Execute fresh selected contract assurance
        run: python scripts/ci_selected.py run --lane linux-release-python --output .local/selected/linux-release-python
      - name: Preserve selected evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-receipt-linux-release-python-attempt-${{ github.run_attempt }}
          path: .local/selected/linux-release-python/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  selected_consumer:
    name: 3D compatibility (linux-3d-consumer)
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.consumer_3d == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source and complete scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore dependency build candidates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/client-3d -> target"
          shared-key: selected-v2-${{ runner.os }}-debug-consumer-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install native build and test dependencies
        if: runner.os == 'Linux'
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev xvfb xauth xdotool libasound2-dev libudev-dev libxi-dev libxinerama-dev libegl1-mesa-dev libvulkan-dev
      - name: Require native Windows desktop
        if: runner.os == 'Windows'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install pinned test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Execute fresh selected contract assurance
        if: needs.scope.outputs.mode == 'selected'
        run: python scripts/ci_selected.py run --lane linux-3d-consumer --output .local/selected/linux-3d-consumer
      - name: Execute fresh exhaustive consumer compatibility
        if: needs.scope.outputs.mode == 'full'
        shell: bash
        run: |
          mkdir -p .local/full-consumer
          cargo check --manifest-path crates/client-3d/Cargo.toml --bin tor-client-3d --locked 2>&1 | tee .local/full-consumer/check.log
          cargo test --manifest-path crates/client-3d/Cargo.toml -p tor-client-3d-model --locked 2>&1 | tee .local/full-consumer/model.log
      - name: Preserve exhaustive consumer logs
        if: always() && needs.scope.outputs.mode == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-consumer-linux-attempt-${{ github.run_attempt }}
          path: .local/full-consumer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve selected evidence
        if: always() && needs.scope.outputs.mode == 'selected'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-receipt-linux-3d-consumer-attempt-${{ github.run_attempt }}
          path: .local/selected/linux-3d-consumer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # Preserve required platform names. Only the proved prose-only path may skip
  # the matrix; missing scope, cancellation and unexpected skips cannot pass.
  check:
    permissions:
      contents: read
      actions: read
    name: Rust (${{ matrix.os }})
    needs: [scope, tooling, profiles, windows_python, windows_binaries, dependencies, selected_rust, selected_linux, selected_windows, selected_release, selected_consumer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout exact source for shard coverage
        if: needs.scope.outputs.docs_only == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require both complete Windows debug Python shards
        if: matrix.os == 'windows-latest' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name verification-windows-latest-debug-python-shard-1-attempt-${{ github.run_attempt }} --dir .local/shard-coverage/debug/1
          gh run download "$GITHUB_RUN_ID" --name verification-windows-latest-debug-python-shard-2-attempt-${{ github.run_attempt }} --dir .local/shard-coverage/debug/2
          python scripts/ci_python_shards.py --profile debug --directory .local/shard-coverage/debug --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Require both complete Windows release Python shards
        if: matrix.os == 'windows-latest' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name verification-windows-latest-release-python-shard-1-attempt-${{ github.run_attempt }} --dir .local/shard-coverage/release/1
          gh run download "$GITHUB_RUN_ID" --name verification-windows-latest-release-python-shard-2-attempt-${{ github.run_attempt }} --dir .local/shard-coverage/release/2
          python scripts/ci_python_shards.py --directory .local/shard-coverage/release --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Independently reconcile selected contract receipts
        if: needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'selected'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'selected-receipt-*-attempt-${{ github.run_attempt }}' --dir .local/selected-receipts
          python scripts/ci_selected.py aggregate --receipts .local/selected-receipts
      - name: Require the complete selected CI gate
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          PROFILES_RESULT: ${{ needs.profiles.result }}
          WINDOWS_PYTHON_RESULT: ${{ needs.windows_python.result }}
          WINDOWS_BINARIES_RESULT: ${{ needs.windows_binaries.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          ASSURANCE_MODE: ${{ needs.scope.outputs.mode }}
          CONSUMER_REQUIRED: ${{ needs.scope.outputs.consumer_3d }}
          APPLICATIONS_REQUIRED: ${{ needs.scope.outputs.requires_apps }}
          SELECTED_RUST: ${{ needs.selected_rust.result }}
          SELECTED_LINUX: ${{ needs.selected_linux.result }}
          SELECTED_WINDOWS: ${{ needs.selected_windows.result }}
          SELECTED_RELEASE: ${{ needs.selected_release.result }}
          SELECTED_CONSUMER: ${{ needs.selected_consumer.result }}
        run: |
          python - <<'PY'
          import os
          mode = os.environ['DOCS_ONLY']
          shared = os.environ['SCOPE_RESULT'] == os.environ['TOOLING_RESULT'] == 'success'
          profiles, dependencies = os.environ['PROFILES_RESULT'], os.environ['DEPENDENCIES_RESULT']
          windows = [os.environ['WINDOWS_PYTHON_RESULT'], os.environ['WINDOWS_BINARIES_RESULT']]
          selected = [os.environ[name] for name in ('SELECTED_RUST', 'SELECTED_LINUX', 'SELECTED_WINDOWS', 'SELECTED_RELEASE')]
          consumer = os.environ['SELECTED_CONSUMER']
          all_skipped = all(value == 'skipped' for value in [*selected, consumer])
          docs = mode == 'true' and profiles == dependencies == 'skipped' and windows == ['skipped', 'skipped'] and all_skipped
          full = mode == 'false' and os.environ['ASSURANCE_MODE'] == 'full' and profiles == dependencies == 'success' and windows == ['success', 'success'] and all(value == 'skipped' for value in selected) and os.environ['CONSUMER_REQUIRED'] == 'true' and consumer == 'success'
          contracts = (mode == 'false' and os.environ['ASSURANCE_MODE'] == 'selected' and profiles == 'skipped' and windows == ['skipped', 'skipped']
                       and dependencies == 'success' and selected[1:3] == ['success', 'success']
                       and selected[0] == selected[3] == ('success' if os.environ['APPLICATIONS_REQUIRED'] == 'true' else 'skipped')
                       and consumer == ('success' if os.environ['CONSUMER_REQUIRED'] == 'true' else 'skipped'))
          # Advisory-only PR jobs retain their existing nonblocking policy.
          raise SystemExit(0 if shared and (docs or full or contracts) else 'Required CI gate did not pass')
          PY
