name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      measure_windows_candidate:
        description: "Run one extra Windows candidate pass after the mandatory full suite"
        type: boolean
        default: false
  # Weekly run on main catches new advisories and stable-toolchain changes
  # without waiting for an unrelated pull request.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository tooling lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --disable-pip-version-check -r .github/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      - name: Lint Python tooling
        run: ruff check scripts

  dependencies:
    name: Dependencies (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory shouldn't block unrelated pull requests; it
    # still fails pushes to main and the weekly scheduled run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  profiles:
    name: Rust (${{ matrix.os }}, ${{ matrix.profile }}, ${{ matrix.partition }})
    runs-on: ${{ matrix.os }}
    # Expose the effective verifier build flags before rust-cache computes its key.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    # Parallel Python/native jobs measured at most 23 minutes (Windows release,
    # cold dependency cache); 40 leaves over 70% headroom. Rust measured at most
    # 31 minutes against its 60-minute budget. These whole-job limits do not
    # change individual test deadlines.
    timeout-minutes: ${{ matrix.partition == 'python' && github.event_name == 'workflow_dispatch' && inputs.measure_windows_candidate && matrix.os == 'windows-latest' && 75 || matrix.partition == 'python' && 40 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        profile: [debug, release]
        partition: [rust, python]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Compute dependency build recipe
        id: build_key
        shell: bash
        run: |
          if key=$(python scripts/ci_build_key.py --profile ${{ matrix.profile }} --partition ${{ matrix.partition }}); then
            printf '%s\n' "$key" >> "$GITHUB_OUTPUT"
          else
            echo 'Dependency cache disabled: recipe helper failed.' >&2
          fi
      - name: Cache Rust dependencies by profile
        if: steps.build_key.outcome == 'success' && steps.build_key.outputs.key != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The action omits a virtual workspace's root manifest from its own
          # hash. The recipe explicitly hashes that root plus actual commands,
          # not reporting/logging source. Unknown recipes bypass only this cache.
          shared-key: ${{ matrix.profile }}-${{ matrix.partition }}-${{ steps.build_key.outputs.key }}
          # Only main writes these caches. A cache hit never qualifies tests.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux Rust build libraries
        if: runner.os == 'Linux'
        # Dependency acquisition has its own bounded budget; a stalled mirror
        # must not consume the partition's complete verification budget.
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev
      - name: Configure Linux graphical test display
        if: runner.os == 'Linux' && matrix.partition == 'python'
        run: timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y xvfb xauth xdotool
      - name: Verify Windows graphical test desktop
        if: runner.os == 'Windows' && matrix.partition == 'python'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install hash-pinned arena search test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Record checkout and resolved input observations before verification
        shell: bash
        run: |
          mkdir -p .local/verify/observations
          python scripts/ci_observation.py --phase before --profile ${{ matrix.profile }} --partition ${{ matrix.partition }} > .local/verify/observations/before.json
      - name: Verify complete profile partition
        timeout-minutes: ${{ matrix.partition == 'python' && 40 || 60 }}
        run: python scripts/verify.py full --ci-profile ${{ matrix.profile }} --ci-partition ${{ matrix.partition }}
      # An explicit, one-off comparison only. The original full pass must succeed
      # first. Second-pass cache warmth means this is not an unbiased speedup.
      - name: Measure reviewed Windows candidate after the full pass
        if: github.event_name == 'workflow_dispatch' && inputs.measure_windows_candidate && runner.os == 'Windows' && matrix.partition == 'python'
        timeout-minutes: 30
        shell: bash
        env:
          CI_PROFILE: ${{ matrix.profile }}
        run: |
          baselines=(.local/verify/*-full-ci-"${CI_PROFILE}"-python/summary.json)
          test "${#baselines[@]}" -eq 1
          test -f "${baselines[0]}"
          python scripts/ci_shadow.py --profile "$CI_PROFILE" --baseline "${baselines[0]}" --output-dir ".local/verify/shadow-${CI_PROFILE}"
      - name: Record checkout and resolved input observations after verification
        if: always()
        shell: bash
        run: |
          mkdir -p .local/verify/observations
          python scripts/ci_observation.py --phase after --profile ${{ matrix.profile }} --partition ${{ matrix.partition }} > .local/verify/observations/after.json
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.partition }}
          path: .local/verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required platform check names. A failed, cancelled or
  # skipped profile/partition must make these checks fail rather than appear as skipped.
  check:
    name: Rust (${{ matrix.os }})
    needs: profiles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Require every partition and profile on both platforms
        env:
          PROFILES_RESULT: ${{ needs.profiles.result }}
        run: test "$PROFILES_RESULT" = success

  # Reporting only: GitHub evaluates the source SHA in this job name. PR jobs
  # execute no repository code here. No gate consumes this job or its report.
  source_identity:
    name: Qualification source (${{ github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Record GitHub source identity
        env:
          TESTED_SHA: ${{ github.sha }}
        run: printf 'GitHub source identity %s; full CI remains required.\n' "$TESTED_SHA"
      - name: Checkout exact source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report possible exact-tree qualification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/ci-qualification
          python scripts/ci_qualification.py --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" > .local/ci-qualification/report.json
          echo 'Reporting only; every existing full CI check remains required.' >> "$GITHUB_STEP_SUMMARY"
          cat .local/ci-qualification/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve qualification report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-report
          path: .local/ci-qualification/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
