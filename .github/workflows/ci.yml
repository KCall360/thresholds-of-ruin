name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run on main catches new advisories and stable-toolchain changes
  # without waiting for an unrelated pull request.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository tooling lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --disable-pip-version-check -r .github/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      - name: Lint Python tooling
        run: ruff check scripts

  dependencies:
    name: Dependencies (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory shouldn't block unrelated pull requests; it
    # still fails pushes to main and the weekly scheduled run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  profiles:
    name: Rust (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies by profile
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.profile }}
          # Only main writes the cache, so pull requests can't evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure Linux graphical test display
        if: runner.os == 'Linux'
        # Dependency acquisition has its own bounded budget; a stalled mirror
        # must not consume the profile's complete verification budget.
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y xvfb xauth xdotool libx11-dev libxcursor-dev libxrandr-dev
      - name: Verify Windows graphical test desktop
        if: runner.os == 'Windows'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Verify complete profile partition
        run: python scripts/verify.py full --ci-profile ${{ matrix.profile }}
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-${{ matrix.os }}-${{ matrix.profile }}
          path: .local/verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing required platform check names. A failed, cancelled or
  # skipped profile must make these checks fail rather than appear as skipped.
  check:
    name: Rust (${{ matrix.os }})
    needs: profiles
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Require every profile on both platforms
        env:
          PROFILES_RESULT: ${{ needs.profiles.result }}
        run: test "$PROFILES_RESULT" = success
