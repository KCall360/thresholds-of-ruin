name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly exhaustive qualification is distinct from selected PR/main assurance.
  schedule:
    - cron: "17 6 * * 1"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      mode: ${{ steps.plan.outputs.mode }}
      consumer_3d: ${{ steps.plan.outputs.consumer_3d }}
      requires_apps: ${{ steps.plan.outputs.requires_apps }}
      build_lane: ${{ steps.plan.outputs.build_lane }}
      linux_lane: ${{ steps.plan.outputs.linux_lane }}
      windows_lane: ${{ steps.plan.outputs.windows_lane }}
    steps:
      - name: Checkout exact source and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation and local links
        run: python3 -m unittest discover -s scripts -p test_documentation.py -v
      - name: Classify complete change scope
        id: scope
        run: python3 scripts/ci_scope.py
      - name: Select independently scoped assurance policy
        id: plan
        run: python3 scripts/ci_test_plan.py --output .local/ci-plan/plan.json
      - name: Retain selected policy explanation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-plan-attempt-${{ github.run_attempt }}
          path: .local/ci-plan/plan.json
          include-hidden-files: true
          if-no-files-found: error

  tooling:
    name: Repository tooling lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --disable-pip-version-check -r .github/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      - name: Lint Python tooling
        run: ruff check scripts

  dependencies:
    name: Dependencies (${{ matrix.checks }})
    needs: scope
    if: ${{ !cancelled() && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory shouldn't block unrelated pull requests; it
    # still fails pushes to main and the weekly scheduled run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  profiles:
    name: Rust (${{ matrix.os }}, ${{ matrix.profile }}, ${{ matrix.partition }})
    needs: scope
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'selected' && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: ${{ matrix.os }}
    # Expose the effective verifier build flags before rust-cache computes its key.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    timeout-minutes: ${{ matrix.partition == 'python' && 40 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        profile: [debug, release]
        partition: [rust, python]
        exclude:
          - os: windows-latest
            profile: debug
            partition: python
          - os: windows-latest
            profile: release
            partition: python
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Compute dependency build recipe
        id: build_key
        shell: bash
        run: |
          if key=$(python scripts/ci_build_key.py --profile ${{ matrix.profile }} --partition ${{ matrix.partition }}); then
            printf '%s\n' "$key" >> "$GITHUB_OUTPUT"
          else
            echo 'Dependency cache disabled: recipe helper failed.' >&2
          fi
      - name: Cache Rust dependencies by profile
        id: rust_cache
        if: steps.build_key.outcome == 'success' && steps.build_key.outputs.key != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The action omits a virtual workspace's root manifest from its own
          # hash. The recipe explicitly hashes that root plus actual commands,
          # not reporting/logging source. Unknown recipes bypass only this cache.
          shared-key: ${{ matrix.profile }}-${{ matrix.partition }}-${{ steps.build_key.outputs.key }}
          # Main and same-repository PRs write only their natural ref-scoped caches.
          # Forks never write; a cache hit never qualifies tests.
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install Linux Rust build libraries
        if: runner.os == 'Linux'
        # Dependency acquisition has its own bounded budget; a stalled mirror
        # must not consume the partition's complete verification budget.
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev
      - name: Configure Linux graphical test display
        if: runner.os == 'Linux' && matrix.partition == 'python'
        run: timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y xvfb xauth xdotool
      - name: Verify Windows graphical test desktop
        if: runner.os == 'Windows' && matrix.partition == 'python'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install hash-pinned arena search test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Verify complete profile partition
        id: verification
        if: success() && !cancelled()
        timeout-minutes: ${{ matrix.partition == 'python' && 40 || 60 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify.py full --ci-profile ${{ matrix.profile }} --ci-partition ${{ matrix.partition }}
      - name: Require fresh complete partition execution
        if: always()
        shell: bash
        env:
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: test "$VERIFICATION_OUTCOME" = success
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: .local/verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  windows_binaries:
    name: Full applications (windows-latest, ${{ matrix.profile }})
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'full' }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check artifact transport contracts before compiling
        run: python -m unittest discover -s scripts -p test_ci_binary_artifact.py
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache ordinary application dependency recipe
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ordinary-applications-v1-${{ matrix.profile }}-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Prepare ordinary application artifact parent
        run: python -c "from pathlib import Path; Path('.local').mkdir(exist_ok=True)"
      - name: Build exact-run ordinary applications
        run: python scripts/ci_binary_artifact.py build --profile ${{ matrix.profile }} --output .local/application-artifact
      - name: Publish binaries, not test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-applications-windows-${{ matrix.profile }}-attempt-${{ github.run_attempt }}
          path: |
            .local/application-artifact/manifest.json
            .local/application-artifact/executables.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  windows_python:
    name: Rust (${{ matrix.os }}, ${{ matrix.profile }}, ${{ matrix.shard && format('python shard {0}', matrix.shard) || matrix.partition }})
    needs: [scope, windows_binaries]
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: ${{ !cancelled() && needs.windows_binaries.result == 'success' && needs.scope.outputs.mode != 'selected' && !(needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'true') }}
    runs-on: ${{ matrix.os }}
    # Expose the effective verifier build flags before rust-cache computes its key.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        profile: [debug, release]
        partition: [python]
        shard: [1, 2]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Compute dependency build recipe
        id: build_key
        shell: bash
        run: |
          if key=$(python scripts/ci_build_key.py --profile ${{ matrix.profile }} --partition ${{ matrix.partition }}); then
            printf '%s\n' "$key" >> "$GITHUB_OUTPUT"
          else
            echo 'Dependency cache disabled: recipe helper failed.' >&2
          fi
      - name: Cache Rust dependencies by profile
        id: rust_cache
        if: steps.build_key.outcome == 'success' && steps.build_key.outputs.key != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The action omits a virtual workspace's root manifest from its own
          # hash. The recipe explicitly hashes that root plus actual commands,
          # not reporting/logging source. Unknown recipes bypass only this cache.
          shared-key: ${{ matrix.profile }}-${{ matrix.partition }}-${{ steps.build_key.outputs.key }}
          # Main and same-repository PRs write only their natural ref-scoped caches.
          # Forks never write; a cache hit never qualifies tests.
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install Linux Rust build libraries
        if: runner.os == 'Linux'
        # Dependency acquisition has its own bounded budget; a stalled mirror
        # must not consume the partition's complete verification budget.
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev
      - name: Configure Linux graphical test display
        if: runner.os == 'Linux' && matrix.partition == 'python'
        run: timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y xvfb xauth xdotool
      - name: Verify Windows graphical test desktop
        if: runner.os == 'Windows' && matrix.partition == 'python'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install hash-pinned arena search test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Download independently built ordinary applications
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name full-applications-windows-${{ matrix.profile }}-attempt-${{ github.run_attempt }} --dir .local/application-artifact
      - name: Verify complete profile partition
        id: verification
        if: success() && !cancelled()
        timeout-minutes: ${{ matrix.partition == 'python' && 40 || 60 }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify.py full --ci-profile ${{ matrix.profile }} --ci-partition python --ci-python-shard ${{ matrix.shard }} --ci-binaries .local/application-artifact
      - name: Require fresh complete shard execution
        if: always()
        shell: bash
        env:
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
        run: test "$VERIFICATION_OUTCOME" = success
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}-${{ matrix.profile }}-${{ matrix.partition }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}-attempt-${{ github.run_attempt }}
          path: .local/verify/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  selected_rust:
    name: Selected (${{ needs.scope.outputs.build_lane }})
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'selected' && needs.scope.outputs.requires_apps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source and complete scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore dependency build candidates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: selected-v2-${{ runner.os }}-debug-rust-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install native build and test dependencies
        if: runner.os == 'Linux'
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev xvfb xauth xdotool
      - name: Require native Windows desktop
        if: runner.os == 'Windows'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install pinned test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Execute fresh selected contract assurance
        run: python scripts/ci_selected.py run --lane ${{ needs.scope.outputs.build_lane }} --output .local/selected/${{ needs.scope.outputs.build_lane }} --produce-binaries .local/application-artifact
      - name: Publish ordinary application binaries (not test evidence)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-applications-ubuntu-debug-attempt-${{ github.run_attempt }}
          path: |
            .local/application-artifact/manifest.json
            .local/application-artifact/executables.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Preserve selected evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-receipt-${{ needs.scope.outputs.build_lane }}-attempt-${{ github.run_attempt }}
          path: .local/selected/${{ needs.scope.outputs.build_lane }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  selected_linux:
    permissions:
      contents: read
      actions: read
    name: Selected (${{ needs.scope.outputs.linux_lane }})
    needs: [scope, selected_rust]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'selected' && (needs.selected_rust.result == 'success' || needs.scope.outputs.requires_apps == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source and complete scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore dependency build candidates
        if: needs.scope.outputs.requires_apps == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: selected-v2-${{ runner.os }}-debug-python-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install native build and test dependencies
        if: runner.os == 'Linux' && needs.scope.outputs.requires_apps == 'true'
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev xvfb xauth xdotool
      - name: Require native Windows desktop
        if: runner.os == 'Windows' && needs.scope.outputs.requires_apps == 'true'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install pinned test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Download exact-run applications
        if: needs.scope.outputs.requires_apps == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name selected-applications-ubuntu-debug-attempt-${{ github.run_attempt }} --dir .local/application-artifact
      - name: Execute fresh selected contract assurance
        run: python scripts/ci_selected.py run --lane ${{ needs.scope.outputs.linux_lane }} --output .local/selected/${{ needs.scope.outputs.linux_lane }} ${{ needs.scope.outputs.requires_apps == 'true' && '--binaries .local/application-artifact' || '' }}
      - name: Preserve selected evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-receipt-${{ needs.scope.outputs.linux_lane }}-attempt-${{ github.run_attempt }}
          path: .local/selected/${{ needs.scope.outputs.linux_lane }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  selected_windows:
    name: Selected (${{ needs.scope.outputs.windows_lane }})
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'selected' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source and complete scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore dependency build candidates
        if: needs.scope.outputs.requires_apps == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: selected-v2-${{ runner.os }}-debug-python-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ job.status == 'success' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
          cache-on-failure: false
      - name: Install native build and test dependencies
        if: runner.os == 'Linux' && needs.scope.outputs.requires_apps == 'true'
        run: |
          timeout --kill-after=10s 2m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          timeout --kill-after=10s 3m sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y libx11-dev libxcursor-dev libxrandr-dev xvfb xauth xdotool
      - name: Require native Windows desktop
        if: runner.os == 'Windows' && needs.scope.outputs.requires_apps == 'true'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Install pinned test environment
        shell: bash
        run: |
          python -m venv .local/arena-search-python
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            task_bin=".local/arena-search-python/Scripts"
            task_python="$task_bin/python.exe"
          else
            task_bin=".local/arena-search-python/bin"
            task_python="$task_bin/python"
          fi
          "$task_python" -m pip install --disable-pip-version-check --require-hashes -r .github/requirements-arena-search.txt
          "$task_python" -c "import os, sys; from pathlib import Path; Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8').write(str(Path(sys.executable).absolute().parent) + '\n')"
      - name: Execute fresh selected contract assurance
        run: python scripts/ci_selected.py run --lane ${{ needs.scope.outputs.windows_lane }} --output .local/selected/${{ needs.scope.outputs.windows_lane }}
      - name: Preserve selected evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-receipt-${{ needs.scope.outputs.windows_lane }}-attempt-${{ github.run_attempt }}
          path: .local/selected/${{ needs.scope.outputs.windows_lane }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  selected_release:
    name: Selected (linux-release-python)
    needs: [scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.docs_only == 'false' && needs.scope.outputs.mode == 'selected' && needs.scope.outputs.requires_apps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout exact source and complete scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore dependency build candidates
