name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run on main catches new advisories and stable-toolchain changes
  # without waiting for an unrelated pull request.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repository tooling lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --disable-pip-version-check -r .github/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint
      - name: Lint Python tooling
        run: ruff check scripts

  dependencies:
    name: Dependencies (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory shouldn't block unrelated pull requests; it
    # still fails pushes to main and the weekly scheduled run.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  check:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust with formatting and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache, so pull requests can't evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure Linux graphical test display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool libx11-dev libxcursor-dev libxrandr-dev
      - name: Verify Windows graphical test desktop
        if: runner.os == 'Windows'
        run: python -c "import ctypes; assert ctypes.windll.user32.GetDesktopWindow(), 'A native Windows desktop is required'"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test dependency checker and actual frontend/server processes (Windows desktop)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Test dependency checker and actual frontend/server processes (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Enforce workspace dependency boundaries
        run: python scripts/check_architecture.py
      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Unit and integration tests (release)
        run: cargo test --workspace --release --locked
      - name: Actual frontend/server process tests (release, Windows desktop)
        if: runner.os == 'Windows'
        env:
          TOR_TEST_PROFILE: release
        run: python -m unittest discover -s scripts -p "test_*process.py" -v
      - name: Actual frontend/server process tests (release, Linux Xvfb)
        if: runner.os == 'Linux'
        env:
          TOR_TEST_PROFILE: release
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m unittest discover -s scripts -p "test_*process.py" -v
